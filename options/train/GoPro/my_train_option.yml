# general settings
name: my_train_option
model_type: TwoImageEventRecurrentRestorationModel
scale: 1
num_gpu: 1
manual_seed: 10

datasets:
  train:
    name: gopro-large-train
    type: GoProRawEventRecurrentDataset
    dataroot: /home/d203_3090/datasets/GOPRO_Large

    # interpolation settings
    num_end_interpolation: 1
    num_inter_interpolation: 3

    # voxel settings
    norm_voxel: true
    one_voxel_flag: true
    return_deblur_voxel: false

    filename_tmpl: '{}'
    io_backend:
      type: disk

    # augment
    gt_size: 256
    use_hflip: true
    use_rot: true
    random_reverse: false

    # data loader settings
    use_shuffle: true
    num_worker_per_gpu: 0
    batch_size_per_gpu: 1
    dataset_enlarge_ratio: 8
    prefetch_mode: ~

  val:
    name: gopro-large-test
    type: GoProRawEventRecurrentDataset
    dataroot: /home/d203_3090/datasets/GOPRO_Large

    # interpolation settings
    num_end_interpolation: 1
    num_inter_interpolation: 3

    # voxel settings
    norm_voxel: true
    one_voxel_flag: true
    return_deblur_voxel: false

    io_backend:
      type: disk

    gt_size: ~
    use_hflip: false
    use_rot: false

dataset_name: GoPro

# network structures
network_g:
  type: FinalBidirectionAttenfusion
  img_chn: 6
  ev_chn: 2
  num_encoders: 3
  base_num_channels: 32
  num_block: 1
  num_residual_blocks: 2

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~
  training_states: ~

# training settings
train:
  optim_g:
    type: AdamW
    lr: !!float 2e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.99]

  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 200000
    eta_min: !!float 1e-7

  total_iter: 200000
  warmup_iter: -1

  pixel_opt:
    type: CharbonnierLoss
    loss_weight: 1
    reduction: mean

# validation settings
val:
  val_freq: !!float 5e4
  save_img: false
  grids: ~
  crop_size: ~
  max_minibatch: 8

  metrics_deblur:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

  metrics_interpo:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 200
  save_checkpoint_freq: !!float 25000
  use_tb_logger: true

# dist training settings
dist_params:
  backend: nccl
  port: 29500
