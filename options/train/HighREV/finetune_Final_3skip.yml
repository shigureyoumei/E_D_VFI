# general settings
name: Finetune_1w_UND_Final_3skip # XXNet_convgru_deblurvoxel #XXNet 
model_type: TwoImageEventRecurrentRestorationModel
scale: 1
num_gpu: 1 # 4
manual_seed: 10

datasets:
  train:
    name: highrev-full-train
    type: RuisiEventRecurrentDataset

    # dataroot: /cluster/work/cvl/leisun/RuisiDataset/UnnamedDataset_mini
    dataroot: /work/HAIRDESC/naran/datasets/EDVFI/HighREV_11_3
    # dataroot: ./datasets/UND_11_1


    # interpolation settings
    num_end_interpolation: 11 # m
    num_inter_interpolation: 3 # n
    # voxel settings
    norm_voxel: true
    one_voxel_flag: true
    # the one_voxel_flag has to be true if want to set 'return_deblur_voxel' to true
    return_deblur_voxel: true

    filename_tmpl: '{}'
    io_backend:
      type: disk

    # augment
    gt_size: 256
    use_hflip: true
    use_rot: true
    random_reverse: false
    # data loader settings
    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 1 # 4 for 2080, 8 for titan
    dataset_enlarge_ratio: 4  # accelarate, equals to the num_gpu
    prefetch_mode: cpu  # ?
    num_prefetch_queue: 2

  val:
    name: highrev-full-val
    type: RuisiEventRecurrentDataset

    # dataroot: /cluster/work/cvl/leisun/RuisiDataset/UnnamedDataset_mini
    dataroot: /work/HAIRDESC/naran/datasets/EDVFI/HighREV_11_3
    # dataroot: ./datasets/UND_11_1

    # interpolation settings
    num_end_interpolation: 11 # m
    num_inter_interpolation: 3 # n
    # voxel settings
    norm_voxel: true
    one_voxel_flag: true
    # the one_voxel_flag has to be true if want to set 'return_deblur_voxel' to true
    return_deblur_voxel: true 

    io_backend:
      type: disk

    gt_size: ~
    use_hflip: false
    use_rot: false

dataset_name: HighREV

# network structures
network_g:
  type: FinalBidirectionAttenfusion # UNetDecoderRecurrent # UNetPSDecoderRecurrent #UNetDecoderRecurrent # UNetDecoderRecurrentSiameseImg
  img_chn: 26 # 6 for two image, 26 for image and voxel
  ev_chn: 2
  num_encoders: 3
  base_num_channels: 32
  # recurrent_block_type: 'simpleconvThendown' # 'convlstm' or 'convgru' or 'simpleconv' or 'simpleconvThendown'
  num_block: 1  # num_block of blocks in each encoder
  num_residual_blocks: 2 # num_block of resblock in the bottleneck of unet
  # use_first_dcn: false

# path
path:
  pretrain_network_g: ./experiments/Final_3skip/models/net_g_latest.pth
  strict_load_g: true
  resume_state: ~ #/cluster/work/cvl/leisun/log_EventInter_Recurrent/experiments/XXNet_simpleconv_1_deblurvoxel_3skip/training_states/80000.state
  training_states: ~ # save current trainig model states, for resume

# training settings
train:
  optim_g:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.99]

  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 10000 
    eta_min: !!float 1e-7

  total_iter: 10000
  warmup_iter: -1 # no warm up

  # losses
  pixel_opt:
    type: CharbonnierLoss
    loss_weight: 1
    reduction: mean

# validation settings
val:
  val_freq: !!float 1e4 # 2e4
  save_img: true  
  save_gt: false
  grids: ~  
  crop_size: 256
  max_minibatch: 8  

  metrics_deblur:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false   
  
  metrics_interpo:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false 

# logging settings
logger:
  print_freq: 200
  save_checkpoint_freq: !!float 2e3
  use_tb_logger: true
  # wandb:
  #   project: your_project_name
  #   resume_id: x

# dist training settings
dist_params:
  backend: nccl
  port: 29500
