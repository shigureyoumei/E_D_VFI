# REFID baseline ablation: replace encoder EVR blocks with Mamba blocks.
name: Ab_mambablock_HighREV_3skip
model_type: TwoImageEventRecurrentRestorationModel
scale: 1
num_gpu: 1
manual_seed: 10

datasets:
  train:
    name: highrev-full-train
    type: RuisiEventRecurrentDataset
    dataroot: /work/HAIRDESC/naran/datasets/EDVFI/HighREV_11_3
    num_end_interpolation: 11
    num_inter_interpolation: 3
    norm_voxel: true
    one_voxel_flag: true
    return_deblur_voxel: true
    filename_tmpl: '{}'
    io_backend:
      type: disk
    gt_size: 256
    use_hflip: true
    use_rot: true
    random_reverse: false
    use_shuffle: true
    num_worker_per_gpu: 4
    batch_size_per_gpu: 1
    dataset_enlarge_ratio: 4
    prefetch_mode: cpu
    num_prefetch_queue: 2
  val:
    name: highrev-full-val
    type: RuisiEventRecurrentDataset
    dataroot: /work/HAIRDESC/naran/datasets/EDVFI/HighREV_11_3
    num_end_interpolation: 11
    num_inter_interpolation: 3
    norm_voxel: true
    one_voxel_flag: true
    return_deblur_voxel: true
    io_backend:
      type: disk
    gt_size: ~
    use_hflip: false
    use_rot: false

dataset_name: HighREV

network_g:
  type: AbMambaBlock
  img_chn: 26
  ev_chn: 2
  num_encoders: 3
  base_num_channels: 32
  num_block: 1
  num_residual_blocks: 2

path:
  # Baseline checkpoints do not strictly match the Mamba EVR replacement.
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~
  training_states: ~

train:
  optim_g:
    type: AdamW
    lr: !!float 1e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.99]
  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 10000
    eta_min: !!float 1e-7
  total_iter: 10000
  warmup_iter: -1
  pixel_opt:
    type: CharbonnierLoss
    loss_weight: 1
    reduction: mean

val:
  val_freq: !!float 2000
  save_img: true
  save_gt: false
  grids: ~
  crop_size: 256
  max_minibatch: 8
  metrics_deblur:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
  metrics_interpo:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

logger:
  print_freq: 200
  save_checkpoint_freq: !!float 5000
  max_keep_checkpoints: 3
  use_tb_logger: true

dist_params:
  backend: nccl
  port: 29500
